[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "categorical-value-grouping"
version = "0.1.0"
description = "Categorical value grouping for thematic symbology: named groups of the values of a field, checked, carried over to new data, coloured, counted in a legend and written as a map style expression, with the same rules as the TypeScript package of the same name."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Alexandros Liaskos" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["cartography", "thematic mapping", "symbology", "unique values", "legend", "maplibre"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/AlexandrosLiaskos/categorical-value-grouping"
Issues = "https://github.com/AlexandrosLiaskos/categorical-value-grouping/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/categorical_value_grouping"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
